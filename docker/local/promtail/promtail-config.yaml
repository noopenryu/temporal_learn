server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_name']
        regex: '/temporal-(.*)'
        target_label: 'service'
        replacement: 'temporal-$1'
      - source_labels: ['__meta_docker_container_name']
        regex: '/temporal$'
        target_label: 'service'
        replacement: 'temporal-server'
      - source_labels: ['__meta_docker_container_name']
        regex: '/loki'
        action: drop
      - source_labels: ['__meta_docker_container_name']
        regex: '/promtail'
        action: drop
      - target_label: 'env'
        replacement: 'local'
