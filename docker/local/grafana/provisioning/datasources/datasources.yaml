apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      maxLines: 2000
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id":\s*"([a-f0-9\-]+)"'
          url: '$${__value.raw}'
          urlDisplayLabel: 'Trace ID: $${__value.raw}'
          datasourceUid: loki
